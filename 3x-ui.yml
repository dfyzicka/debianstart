name: debian-start-3x-ui
services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:v3.11.0
    network_mode: host
    restart: unless-stopped
    environment:
      XUI_ENABLE_FAIL2BAN: "false"
    volumes:
      - ./db:/etc/x-ui
      - ./cert:/root/cert
    logging:
      options:
        max-size: "10m"
        max-file: "3"
